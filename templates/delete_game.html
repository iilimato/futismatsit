{% extends "layout.html" %}

{% block title %}Poista peli-ilmoitus{% endblock %}

{% block content %}
<h2>Poista peli-ilmoitus</h2>
<p>Oletko varma, että haluat poistaa ilmoituksen pelistä "{{ game.title }}"?</p>
<form action="/delete_game/{{ game.id }}" method="post">
  <input type="submit" name="confirm" value="Poista ilmoitus" />
  <input type="submit" name="cancel" value="Peruuta" />
</form>
{% endblock %}
