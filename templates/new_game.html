{% extends "layout.html" %}

{% block title %}Luo uusi peli-ilmoitus{% endblock %}

{% block content %}
<h2>Luo uusi peli-ilmoitus</h2>
<form action="/create_game" method="post">
  <p>
    Otsikko: <br />
    <input type="text" name="title" maxlength="50" required />
  </p>
  <p>
    Kuvaus: <br />
    <textarea name="description" rows="4" cols="60" maxlength="1000"></textarea>
  </p>
  {% for class in classes %}
  <p> 
    {{ class }}: <br />
    <select name="{{ class }}">
      <option value="">(valitse)</option>
      {% for option in classes[class] %}
      <option value="{{ option }}">{{ option }}</option>
      {% endfor %}
    </select>
  </p>
  {% endfor %}

  <p>
    Kenttä: <br />
    <input type="text" name="location" maxlength="50" required />
  </p>
  <p>
    Pelaajien määrä: <br />
    <input type="number" name="player_count" min="2" max="99" required />
  </p>
  <p>
    Päivämäärä (DD.MM.YYYY): <br />
    <input type="text" name="date" maxlength="10" pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.\d{4}" required />
  </p>
  <p>
    Kellonaika (HH:MM): <br />
    <input type="text" name="time" maxlength="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" required />
  </p>
  <input type="submit" value="Luo ilmoitus" />
</form>
{% endblock %}
