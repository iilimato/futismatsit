{% extends "layout.html" %}

{% block title %}Muokkaa peli-ilmoitusta{% endblock %}

{% block content %}
<h2>Muokkaa peli-ilmoitusta</h2>
<form action="/update_game" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <p>
    <label for="title">Otsikko:</label><br />
    <input type="text" id="title" name="title" value="{{ game.title }}" required maxlength="50" />
  </p>
  <p>
    <label for="description">Kuvaus:</label><br />
    <textarea id="description" name="description" rows="4" cols="60" maxlength="1000" required>{{ game.description }}</textarea>
  </p>
  {% for class in classes %}
  <p>
    <label for="class_{{ class }}">{{ class }}:</label><br />
    <select id="class_{{ class }}" name="{{ class }}" required>
      <option value="">(valitse)</option>
      {% for option in classes[class] %}
      <option value="{{ option }}" {% if option == level %}selected{% endif %}>{{ option }}</option>
      {% endfor %}
    </select>
  </p>
  {% endfor %}
  <p>
    <label for="location">Kenttä:</label><br />
    <input type="text" id="location" name="location" value="{{ game.location }}" required maxlength="50" />
  </p>
  <p>
    <label for="player_count">Pelaajien määrä:</label><br />
    <input type="number" id="player_count" name="player_count" min="2" value="{{ game.player_count }}" required />
  </p>
  <p>
    <label for="date">Päivämäärä:</label><br />
    <input type="date" id="date" name="date" value="{{ game.date }}" required />
  </p>
  <p>
    <label for="time">Kellonaika:</label><br />
    <input type="time" id="time" name="time" value="{{ game.time }}" required />
  </p>
  <input type="hidden" name="game_id" value="{{ game.id }}" />
  <input type="submit" value="Tallenna muutokset" />
</form>
{% endblock %}
