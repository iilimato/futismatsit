{% extends "layout.html" %}

{% block title %}Muokkaa peli-ilmoitusta{% endblock %}

{% block content %}
<h2>Muokkaa peli-ilmoitusta</h2>
<form action="/update_game" method="post">
  <p>
    Otsikko: <br />
    <input type="text" name="title" value="{{ game.title }}" required maxlength="50" />
  </p>
  <p>
    Kuvaus: <br />
    <textarea name="description" rows="4" cols="60" maxlength="1000" required>{{ game.description }}</textarea>
  </p>
  {% for class in classes %}
  <p>
    {{ class }}: <br />
    <select name="{{ class }}">
      <option value="">(valitse)</option>
      {% for option in classes[class] %}
      <option value="{{ option }}" {% if option == level %}selected{% endif %}>{{ option }}</option>
      {% endfor %}
    </select>
  </p>
  {% endfor %}
  <p>
    Kenttä: <br />
    <input type="text" name="location" value="{{ game.location }}" required maxlength="50" />
  </p>
  <p>
    Pelaajien määrä: <br />
    <input type="number" name="player_count" min="2" value="{{ game.player_count }}" required />
  </p>
  <p>
    Päivämäärä (DD.MM.YYYY): <br />
    <input type="text" name="date" value="{{ game.date }}" pattern="(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.\d{4}" required />
  </p>
  <p>
    Kellonaika (HH:MM): <br />
    <input type="text" name="time" value="{{ game.time }}" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" required />
  </p>
  <input type="hidden" name="game_id" value="{{ game.id }}" />
  <input type="submit" value="Tallenna muutokset" />
</form>
{% endblock %}
